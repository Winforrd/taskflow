server:
  port: 8080

spring:
  application:
    name: taskflow-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/taskflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123

  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      timeout: 3000ms

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: taskflow-token
  timeout: 2592000
  active-timeout: 1800
  is-concurrent: true
  is-share: true

knife4j:
  enable: true

taskflow:
  upload:
    avatar-dir: ./uploads/avatars
    avatar-url-prefix: /uploads/avatars/